<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squaggle!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <div class="main-wrap">
      <div class="new-game-options">

        <!--Board Size Switch-->
        <div class="option-switch board-size">
          <input id="board-switch-3x3" name="board-size" type="radio" value="3">
          <label for="board-switch-3x3">3x3</label>

          <input id="board-switch-4x4" name="board-size" type="radio" value="4" checked>
          <label for="board-switch-4x4">4x4</label>

          <input id="board-switch-5x5" name="board-size" type="radio" value="5">
          <label for="board-switch-5x5">5x5</label>

          <div class="slider"></div>
        </div>

        <!--Add Timer Options Here-->
        <div class="option-switch timer">
          <input id="timer-switch-untimed" name="game-timer" type="radio" value="0" checked>
          <label for="timer-switch-untimed">&infin;</label>

          <input id="timer-switch-1min" name="game-timer" type="radio" value="1">
          <label for="timer-switch-1min">1min</label>

          <input id="timer-switch-3min" name="game-timer" type="radio" value="3">
          <label for="timer-switch-3min">3min</label>

          <input id="timer-switch-5min" name="game-timer" type="radio" value="5">
          <label for="timer-switch-5min">5min</label>

          <div class="slider"></div>
        </div>

        <!--New Game Button-->
        <button type="button" class="styled-button" title="New Game" id="new-game-button">New Game</button>
      </div>
      <div class="game-wrap">
        <div class="in-game-controls">
          <!--Score | Words Remaining | Randomize/Align Orientation:Rotate Board-->
          <div class="score">
            0 points
          </div>
          <div class="words-remaining">
            X words remaining
          </div>
          <div class="in-game-buttons-wrap">
            <input type="button" title="Scramble Letter Orientations" value="?" id="scramble-button">
            <input type="button" title="Align Letters" value="|A|" id="align-button">
            <input type="button" title="Rotate Board" value="R" id="rotate-button">
          </div>
        </div>
        <div class="letter-board-wrap" id="letter-board-wrap">
        </div>
        <div class="in-game-hints">
          <!--Shapes with edges = len(word) with num words remaining-->
        </div>
      </div>
      <div>
        <!--Will hold elements that appear after (below or to the right) of the game board.-->
      </div>
    </div>
  </body>
</html>
